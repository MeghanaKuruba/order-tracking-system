server:
  port: 8088

spring:
  application:
    name: verification-service

  datasource:
    url: jdbc:h2:mem:verificationdb
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info